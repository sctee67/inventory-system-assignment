spring.application.name=inventory-management
server.port=8080

# Active profile: use 'dev' for H2, default for MySQL
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# MySQL (default)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGp3dCB0b2tlbiBnZW5lcmF0aW9u
jwt.expiration-ms=86400000

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=./uploads/products

# Logging
logging.level.com.inventory=DEBUG
logging.level.org.springframework.security=INFO
